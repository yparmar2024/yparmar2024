name: Wordle Game Action

on:
  issues:
    types: [opened]
  schedule:
    - cron: '0 0 * * *'

jobs:
  wordle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
          
      - name: Process Guess
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'wordle|')
        env:
          TITLE: ${{ github.event.issue.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GUESS=$(echo "$TITLE" | cut -d '|' -f 2)
          if ! python3 src/wordle.py --action guess --guess "$GUESS"; then
            gh issue close ${{ github.event.issue.number }} -c "Your guess was rejected! Make sure it's a valid 5-letter English word."
            exit 1
          fi
          
      - name: Reset Game
        if: github.event_name == 'schedule'
        run: |
          python3 src/wordle.py --action reset
          
      - name: Commit Game State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json assets/wordle.svg
          git commit -m "Update Wordle game state" || exit 0

      - name: Update README Cache Buster Hash
        run: |
          HASH=$(git rev-parse HEAD)
          sed -i -E "s|https://raw.githubusercontent.com/yparmar2024/yparmar2024/[a-f0-9]+/assets/wordle\.svg|https://raw.githubusercontent.com/yparmar2024/yparmar2024/${HASH}/assets/wordle.svg|g" README.md
          git add README.md
          git commit -m "Update README Cache Buster Hash" || exit 0
          git push

      - name: Close Issue
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'wordle|')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} -c "Your guess was processed! Check the README to see if you were right."
